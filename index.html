<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruang Belajar Adiva · FK UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Ide: buku harian dokter yang manis. Dasar merah muda pastel kaya, ditemani lilac, mint, peach, langit, dan butter.
   Tiap kartu punya garis warna sendiri supaya halaman terasa hidup tapi tetap mudah dibaca. */
:root{
  --bg:#FFF1F6; --card:#FFFFFF; --ink:#3B2740; --muted:#7A6580; --line:#F3D9E4;
  --accent:#C93C68; --accent-ink:#FFFFFF;
  --pk:#FFD3E3; --lv:#E4D9FF; --mn:#D2F2E4; --pc:#FFE1C9; --sk:#D5E8FF; --bt:#FFF0B5;
  --sage:#4E9F7D; --lilac:#8E73E0; --butter:#FFD98A; --warn:#B86A0C; --ok:#2E8F68;
  --soft:color-mix(in srgb,var(--accent) 11%,var(--card));
  --soft2:color-mix(in srgb,var(--accent) 22%,var(--card));
  --hijab:color-mix(in srgb,var(--accent) 45%,#fff);
  --shadow:0 8px 26px rgba(201,60,104,.12);
  --font-d:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-b:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1D1421; --card:#2A1E30; --ink:#F7EAF1; --muted:#C9B4D0; --line:#42304B;
    --pk:#5A2B42; --lv:#3F3363; --mn:#1F4A3D; --pc:#5A3A25; --sk:#233F5F; --bt:#5A4D1E;
    --shadow:0 8px 24px rgba(0,0,0,.35); --warn:#F0A94A; --ok:#58C79C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1421; --card:#2A1E30; --ink:#F7EAF1; --muted:#C9B4D0; --line:#42304B;
  --pk:#5A2B42; --lv:#3F3363; --mn:#1F4A3D; --pc:#5A3A25; --sk:#233F5F; --bt:#5A4D1E;
  --shadow:0 8px 24px rgba(0,0,0,.35); --warn:#F0A94A; --ok:#58C79C; color-scheme:dark;
}
[data-accent="matcha"]{--accent:#3A8664}
[data-accent="lilac"]{--accent:#7B5FD6}
[data-accent="langit"]{--accent:#2F6FC0}
[data-accent="peach"]{--accent:#B8561F}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:radial-gradient(520px 340px at 8% -4%,var(--pk),transparent 70%),radial-gradient(520px 360px at 100% 6%,var(--lv),transparent 70%),radial-gradient(560px 380px at 0% 100%,var(--mn),transparent 72%),radial-gradient(520px 340px at 100% 100%,var(--pc),transparent 70%);background-attachment:fixed;color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--font-d);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.1px}
h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 96px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 86%,var(--pk));backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--font-d);font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand{line-height:1.1}.brand small{display:block;font-family:var(--font-b);font-weight:800;font-size:.72rem;color:var(--muted);letter-spacing:.02em}
.crest{width:42px;height:46px;flex:none;display:grid;place-items:center}.crest svg,.crest img{width:100%;height:100%;object-fit:contain}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--soft);font-weight:700;font-size:.82rem;border:1px solid var(--line);white-space:nowrap}
.chip.k{border-color:transparent;color:#fff}
.stats .chip:nth-child(1){background:var(--pk)}.stats .chip:nth-child(2){background:var(--bt)}.stats .chip:nth-child(3){background:var(--mn)}.stats .chip:nth-child(4){background:var(--sk)}
nav.tabs{max-width:980px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto}
nav.tabs a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:800;font-size:.92rem;white-space:nowrap;border:1px solid transparent}
nav.tabs a::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tc,var(--accent));margin-right:7px;vertical-align:1px}
nav.tabs a[data-tab="hari-ini"]{--tc:#F27AA5}nav.tabs a[data-tab="peta"]{--tc:#A98BEA}nav.tabs a[data-tab="strategi"]{--tc:#5CC9A0}nav.tabs a[data-tab="bank"]{--tc:#4A9BD9}nav.tabs a[data-tab="rapor"]{--tc:#FFAB73}nav.tabs a[data-tab="ulangan"]{--tc:#E0508A}nav.tabs a[data-tab="avatar"]{--tc:#6BB3F0}nav.tabs a[data-tab="atur"]{--tc:#E8C34A}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs a[aria-current="page"]::before{background:#fff}
nav.tabs a:hover{border-color:var(--line)}
main{padding-top:18px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--cc,#F27AA5);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
main>.card:nth-child(5n+1){--cc:#F27AA5}main>.card:nth-child(5n+2){--cc:#A98BEA}main>.card:nth-child(5n+3){--cc:#5CC9A0}main>.card:nth-child(5n+4){--cc:#FFAB73}main>.card:nth-child(5n+5){--cc:#6BB3F0}
.card>header{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card>header .sp{margin-left:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.78rem}
.btn{text-decoration:none;display:inline-block;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:12px;padding:9px 14px;transition:transform .12s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(0)}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:.84rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* hero */
.hero{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:center;background:linear-gradient(150deg,var(--pk),var(--lv) 55%,var(--card) 100%)}
.idline{font-weight:800;color:var(--accent);margin-bottom:2px}
@media (max-width:640px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
.avwrap{position:relative;width:210px;height:230px;cursor:pointer}
.avwrap svg{width:100%;height:100%;overflow:visible}
.bubble{position:relative;background:var(--card);border:2px solid var(--accent);border-radius:18px;padding:12px 14px;font-weight:700;max-width:420px}
.bubble::before{content:"";position:absolute;left:-10px;top:26px;width:16px;height:16px;background:var(--card);border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg)}
@media (max-width:640px){.bubble::before{left:calc(50% - 8px);top:-10px;border:0;border-left:2px solid var(--accent);border-top:2px solid var(--accent);transform:rotate(45deg)}}
.hero h1{font-size:1.6rem;margin-bottom:6px}
.hero-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:inherit}
.xpbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px;width:100%;max-width:420px}
.xpbar b{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--butter));border-radius:99px;transition:width .5s}
.bob{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
.blink{animation:blink 4.5s infinite;transform-origin:center;transform-box:fill-box}
.spark{animation:twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.spark:nth-of-type(2){animation-delay:.5s}.spark:nth-of-type(3){animation-delay:1s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
/* sticker mapel */
.st{display:inline-grid;place-items:center;min-width:44px;height:44px;padding:0 6px;border-radius:14px;font-family:var(--font-d);font-weight:700;font-size:.8rem;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 20%,var(--card));color:var(--ink);transform:rotate(-3deg);flex:none}
.tag{display:inline-block;padding:1px 8px;border-radius:8px;font-size:.74rem;font-weight:800;background:color-mix(in srgb,var(--c) 18%,var(--card));border:1px solid color-mix(in srgb,var(--c) 55%,transparent)}
/* misi */
.mis{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.mis+.mis{margin-top:10px}
.mis.done{background:color-mix(in srgb,var(--ok) 10%,var(--card));border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.mis.done .nm{text-decoration:line-through;color:var(--muted)}
.mis .nm{font-weight:800}
.mis .why{font-size:.8rem;color:var(--muted);margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.check{width:40px;height:40px;border-radius:12px;border:2px solid var(--accent);background:transparent;color:var(--accent);display:grid;place-items:center;font-size:1.25rem;font-weight:900;line-height:1}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.micro{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px dashed var(--line);background:var(--soft);text-align:left;width:100%}
.micro[aria-pressed="true"]{background:color-mix(in srgb,var(--ok) 14%,var(--card));border-style:solid;border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.micro .bx{width:22px;height:22px;border-radius:7px;border:2px solid var(--accent);display:grid;place-items:center;font-size:.8rem;font-weight:900;flex:none}
.micro[aria-pressed="true"] .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.micro-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:640px){.micro-g{grid-template-columns:1fr}}
/* timer */
.timer{font-family:var(--font-d);font-size:3rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
/* ritme */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:.76rem;font-weight:800;background:var(--card)}
.wd.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wd small{display:block;font-weight:700;opacity:.85;margin-top:2px}
/* bars + rings */
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar b{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px;transition:width .4s}
.ringbox{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:16px}
.ring{width:76px;height:76px;flex:none}
.ring text{font-family:var(--font-d);font-weight:700;fill:var(--ink)}
/* peta */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.84rem}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.subj{display:grid;gap:10px}
.stage{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:6px}
.top-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.top-row .nm{font-weight:700}
.top-row.done .nm{color:var(--muted);text-decoration:line-through}
.pin{border:1px solid var(--line);background:var(--card);border-radius:10px;width:34px;height:34px;font-size:1rem;color:var(--muted)}
.pin[aria-pressed="true"]{background:var(--butter);color:#5a3d00;border-color:#e6b84f}
.mini-check{width:30px;height:30px;border-radius:9px;border:2px solid var(--accent);background:transparent;color:#fff;font-weight:900;display:grid;place-items:center}
.mini-check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
/* form */
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-weight:800;font-size:.86rem}
.form input,.form select,.form textarea{padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-weight:600;width:100%}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.checks{display:flex;gap:10px;flex-wrap:wrap}
.checks label{display:inline-flex;grid-auto-flow:column;align-items:center;gap:6px;font-weight:700}
.checks input{width:auto}
/* timeline */
.tl{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;align-items:center}
.tl li.next{border-color:var(--accent);background:var(--soft)}
.tl li.past{opacity:.55}
.tl .dt{font-family:var(--font-d);font-weight:600;line-height:1.15}
.tl .dt small{display:block;font-family:var(--font-b);font-weight:700;color:var(--muted)}
/* log */
.logrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.logrow .sc{font-family:var(--font-d);font-weight:700;font-size:1.1rem;min-width:56px}
.chart{width:100%;height:auto;max-height:170px}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-b);font-weight:700}
.chart .ln{stroke:var(--accent);stroke-width:2.5;fill:none}
.chart .tg{stroke:var(--sage);stroke-dasharray:4 4;stroke-width:1.5}
.chart .gd{stroke:var(--line);stroke-width:1}
.chart circle{fill:var(--accent)}
.empty{padding:14px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}
/* toast + confetti */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:800;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
pre.copy{white-space:pre-wrap;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:var(--font-b);font-size:.9rem;margin:0}

/* belajar & kuis */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.84rem}
.steps button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qstem{font-size:1.12rem;font-weight:700;margin:14px 0;white-space:pre-line}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;text-align:left;padding:11px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700}
.opt b{width:28px;height:28px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font-family:var(--font-d)}
.opt:not([disabled]):hover{border-color:var(--accent)}
.opt.pick{border-color:var(--accent);background:var(--soft)}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.bad{border-color:#D8505A;background:color-mix(in srgb,#D8505A 12%,var(--card))}
.opt[disabled]{cursor:default;opacity:1;color:var(--ink)}
.expl{margin-top:12px;padding:12px;border-radius:14px;border:1px solid var(--line)}
.expl.ok{background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.expl.no{background:color-mix(in srgb,#D8505A 8%,var(--card))}
.score{font-family:var(--font-d);font-weight:700;font-size:3rem;line-height:1}
.score small{font-size:1.2rem;color:var(--muted)}
.rv{padding:10px 0;border-top:1px solid var(--line);display:grid;gap:2px}
.rv.ok>div:first-child{color:var(--ok)} .rv.no>div:first-child{color:#C23B49}
.lesson h3{margin:16px 0 6px}
.lesson ul{margin:0;padding-left:20px;display:grid;gap:6px}
.lesson .ex{padding:10px 12px;border-radius:12px;background:var(--soft);margin-top:8px}
.lesson .tp{border-top:1px dashed var(--line);margin-top:14px;padding-top:10px}
.lesson .tpn{font-size:1.02rem;margin-bottom:4px}
.lesson .tpo{margin:8px 0 0;padding-left:26px;display:grid;gap:4px}
.lesson details{margin-top:8px}.lesson summary{cursor:pointer;font-weight:800;color:var(--accent)}
.lesson p{margin:6px 0}
.lesson .vids{list-style:none;padding:0;display:grid;gap:8px}
.lesson .vids a{font-weight:800}
.rapor{display:grid;grid-template-columns:1fr 90px 90px;gap:10px;align-items:center}
.rapor input{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);width:100%;font-weight:700}
.form textarea{resize:vertical}
/* ulangan */
.exrow{border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:11px 13px;background:var(--card)}
.exrow+.exrow{margin-top:10px}
.exhead{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wrapseg{flex-wrap:wrap;gap:6px;display:flex;border-radius:16px}
.schrow{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:8px 10px;border-radius:12px;background:var(--soft)}
.schrow+.schrow{margin-top:6px}
.schrow .sd{display:grid;line-height:1.15}
.schrow.k-h{background:var(--pk)}.schrow.k-review{background:var(--bt)}.schrow.k-latih{background:var(--sk)}.schrow.k-learn{background:var(--mn)}
/* strategi, avatar */
.seg2{gap:6px}
.ki{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.ki+.ki{margin-top:8px}
.ki summary{list-style:none;cursor:pointer;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:11px 12px}
.ki summary::-webkit-details-marker{display:none}
.ki summary::before{content:'▸';color:var(--accent);font-weight:900;transition:transform .15s}
.ki[open] summary::before{transform:rotate(90deg)}
.ki[open]{border-color:var(--accent)}
.kn{font-weight:800;flex:1;min-width:160px}
.kb{display:flex;gap:6px;flex-wrap:wrap}
.kbody{padding:2px 14px 14px;display:grid;gap:8px}
.kt{background:var(--soft);border-radius:12px;padding:9px 11px}
a.tag.lnk{text-decoration:none;color:var(--ink)}a.tag.lnk:hover{border-color:var(--c)}
.stratlist{margin:0;padding-left:22px;display:grid;gap:8px}
.gaplist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.gaplist li{display:grid;gap:2px;padding:10px 12px;border:1px solid var(--line);border-left:5px solid #FFAB73;border-radius:12px;background:var(--card)}
.gaplist li:nth-child(3n+2){border-left-color:#A98BEA}.gaplist li:nth-child(3n){border-left-color:#5CC9A0}
.avgrid{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
@media (max-width:700px){.avgrid{grid-template-columns:1fr}}
.avprev{width:100%;max-width:260px;margin:0 auto;aspect-ratio:220/240}
